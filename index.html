<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>シンOneStep メンバー紹介</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",Meiryo,sans-serif;color:#202c3a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #e1e8ef;border-radius:18px;box-shadow:0 12px 40px #1f344014}.mark{width:44px;height:44px;border-radius:14px;background:#eaf1f7;color:#315c84;display:grid;place-items:center;font-size:22px;margin-bottom:18px}.card h1{font-size:1.4rem;margin:0 0 8px}.card p{margin:0 0 22px;color:#607184}.card label{display:block;font-weight:600;margin-bottom:7px}.card input{width:100%;padding:12px 14px;border:1px solid #cad6e0;border-radius:10px;font:inherit}.card input:focus{outline:3px solid #477aa826;border-color:#477aa8}.card button{width:100%;margin-top:12px;padding:12px 14px;background:#315c84;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.error{color:#a22929;min-height:1.5em;margin-top:10px;font-size:.92rem}#site{display:none;width:100%;min-height:100vh;border:0;background:#f4f7fa}.hint{text-align:center;font-size:.78rem;color:#8090a0;margin-top:18px}</style></head>
<body><main class="gate" id="gate"><form class="card" id="form"><div class="mark" aria-hidden="true">✦</div><h1>シンOneStep メンバー紹介</h1><p>閲覧するには鍵を入力してください。</p><label for="key">閲覧鍵</label><input type="password" id="key" autocomplete="current-password" required><button type="submit">開く</button><div class="error" id="error" role="alert"></div><div class="hint">プロフィールデータは暗号化されています。</div></form></main><iframe id="site" title="メンバー紹介"></iframe>
<script>
const ITERATIONS=600000, AAD=new TextEncoder().encode("shin-onestep-profile-v1");
const enc=x=>new TextEncoder().encode(x), fromHex=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
async function derive(password,salt){const material=await crypto.subtle.importKey("raw",enc(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"])}
function prepare(source){return source.replace(/<head([^>]*)>/i,'<head$1><base href="./">').replace(/<\/body>/i,'<script>document.addEventListener("click",function(e){const a=e.target.closest("a");if(!a)return;const u=new URL(a.href);if(u.pathname.endsWith("contents.html")){e.preventDefault();parent.showProtectedPage("contents",u.hash)}else if(u.pathname.endsWith("index.html")){e.preventDefault();parent.showProtectedPage("index","")}});<\\/script></body>')}
let pages;
window.showProtectedPage=(name,hash)=>{const frame=document.getElementById("site");frame.srcdoc=prepare(pages[name]);frame.onload=()=>{if(hash){const id=decodeURIComponent(hash.slice(1));frame.contentDocument.getElementById(id)?.scrollIntoView()}}};
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("error"),key=document.getElementById("key").value;msg.textContent="";try{const r=await fetch("profiles.enc.json",{cache:"no-store"});if(!r.ok)throw 0;const box=await r.json(),cryptoKey=await derive(key,fromHex(box.salt)),encrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromHex(box.nonce),additionalData:AAD},cryptoKey,fromHex(box.ciphertext)),plain=await new Response(new Blob([encrypted]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();pages=JSON.parse(new TextDecoder().decode(plain));document.getElementById("gate").style.display="none";document.getElementById("site").style.display="block";showProtectedPage("index","")}catch{msg.textContent="鍵が違うか、サイトを読み込めませんでした。もう一度お試しください。"}});
</script></body></html>
