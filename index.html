<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>シンOneStep メンバー紹介</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",Meiryo,sans-serif;color:#202c3a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #e1e8ef;border-radius:18px;box-shadow:0 12px 40px #1f344014}.mark{width:44px;height:44px;border-radius:14px;background:#eaf1f7;color:#315c84;display:grid;place-items:center;font-size:22px;margin-bottom:18px}.card h1{font-size:1.4rem;margin:0 0 8px}.card p{margin:0 0 22px;color:#607184}.card label{display:block;font-weight:600;margin-bottom:7px}.card input{width:100%;padding:12px 14px;border:1px solid #cad6e0;border-radius:10px;font:inherit}.card input:focus{outline:3px solid #477aa826;border-color:#477aa8}.card button{width:100%;margin-top:12px;padding:12px 14px;background:#315c84;color:#fff;border:0;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.error{color:#a22929;min-height:1.5em;margin-top:10px;font-size:.92rem}#site{display:none;width:100%;min-height:100vh;border:0;background:#f4f7fa}.hint{text-align:center;font-size:.78rem;color:#8090a0;margin-top:18px}</style></head>
<body><main class="gate" id="gate"><form class="card" id="form"><div class="mark" aria-hidden="true">✦</div><h1>シンOneStep メンバー紹介</h1><p>閲覧するには鍵を入力してください。</p><label for="key">閲覧鍵</label><input type="password" id="key" autocomplete="current-password" required><button type="submit">開く</button><div class="error" id="error" role="alert"></div><div class="hint">プロフィールデータは暗号化されています。</div></form></main><div id="site"></div>
<script>
const ITERATIONS=600000, AAD=new TextEncoder().encode("shin-onestep-profile-v1");
const enc=x=>new TextEncoder().encode(x), fromHex=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
async function derive(password,salt){const material=await crypto.subtle.importKey("raw",enc(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"])}

let pages;
function renderSite(pages){
  const indexDoc=new DOMParser().parseFromString(pages.index,"text/html"),profileDoc=new DOMParser().parseFromString(pages.contents,"text/html");
  const style=document.createElement("style");style.textContent=[...indexDoc.querySelectorAll("style"),...profileDoc.querySelectorAll("style")].map(x=>x.textContent).join("\n")+"\n#site #directory.container{display:block;max-width:1080px}#site #directory .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}#site #directory #member-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}#site #directory #member-list li a{height:100%}#site [hidden]{display:none!important}#site .back-button{display:inline-block;margin:12px 0;padding:8px 12px;border-radius:9px;background:#eaf1f7;color:#315c84;text-decoration:none;font-weight:600}#site .all-members-button{display:inline-block;margin:0 0 18px;padding:11px 16px;border-radius:10px;background:#315c84;color:#fff;text-decoration:none;font-weight:700}#site #all-view{max-width:1080px}#site #all-view .member-table{margin:0 0 8px}#site .edit-request-button{margin:0 0 28px;padding:9px 13px;border:1px solid #315c84;border-radius:9px;background:#fff;color:#315c84;font:inherit;font-weight:650;cursor:pointer}#site .request-dialog{width:min(92vw,560px);padding:24px;border:0;border-radius:16px;box-shadow:0 16px 60px #10203055;color:#202c3a}#site .request-dialog::backdrop{background:#15233388}#site .request-dialog h2{margin:0 0 8px;font-size:1.25rem}#site .request-dialog p{line-height:1.6;color:#536579}#site .request-dialog textarea{width:100%;min-height:150px;padding:12px;border:1px solid #cad6e0;border-radius:9px;font:inherit;resize:vertical}#site .request-dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}#site .request-dialog button{padding:9px 13px;border:0;border-radius:8px;font:inherit;cursor:pointer}#site .request-dialog [type=submit]{background:#315c84;color:#fff}";document.head.append(style);
  const site=document.getElementById("site"),header=indexDoc.querySelector("header").cloneNode(true),directory=document.createElement("main"),view=document.createElement("main"),allView=document.createElement("main");directory.className="container";directory.id="directory";view.className="container";view.id="profile-view";view.hidden=true;allView.className="container";allView.id="all-view";allView.hidden=true;
  const list=indexDoc.querySelector("#member-list").cloneNode(true),cards=[...profileDoc.querySelectorAll(".member-table")],cardMap=new Map();for(const card of cards){const id=card.querySelector("th[id]")?.id;if(id)cardMap.set(id,card)}
  for(const li of list.querySelectorAll("li")){const a=li.querySelector("a"),id=a?.getAttribute("href")?.match(/#(\d+)$/)?.[1];if(id){a.href="#member-"+id;a.dataset.member=id}}
  const toolbar=indexDoc.querySelector(".toolbar")?.cloneNode(true);if(toolbar)directory.append(toolbar);const allLink=document.createElement("a");allLink.className="all-members-button";allLink.href="#all-members";allLink.textContent="全員を上から順番に見る";directory.append(allLink,list);const back=document.createElement("a");back.className="back-button";back.href="#directory";back.textContent="← メンバー一覧へ";back.addEventListener("click",e=>{e.preventDefault();view.hidden=true;allView.hidden=true;directory.hidden=false;window.scrollTo(0,0)});
  const requestDialog=document.createElement("dialog");requestDialog.className="request-dialog";requestDialog.innerHTML='<form method="dialog"><h2>プロフィール変更の申請</h2><p class="request-member"></p><p>変更したい内容を入力してください。送信前にGitHubで内容を確認できます。申請は公開リポジトリで公開され、GitHubへのログインが必要です。</p><label for="request-text">変更内容</label><textarea id="request-text" required placeholder="例：趣味の欄を「読書、映画」に変更したい"></textarea><div class="dialog-actions"><button type="button" data-cancel>キャンセル</button><button type="submit">申請内容を確認する</button></div></form>';
  const requestForm=requestDialog.querySelector("form"),requestText=requestDialog.querySelector("textarea"),requestMember=requestDialog.querySelector(".request-member");let requestId="",requestName="";
  requestDialog.querySelector("[data-cancel]").addEventListener("click",()=>requestDialog.close());requestForm.addEventListener("submit",e=>{e.preventDefault();const title=`プロフィール変更申請：No.${requestId} ${requestName}`,body=`対象メンバー：No.${requestId} ${requestName}\n\n変更希望：\n${requestText.value.trim()}\n\nこの申請は確認後、サイト管理者が反映します。`;const url="https://github.com/dandou0321-debug/shin-onestep-profile/issues/new?"+new URLSearchParams({title,body});window.open(url,"_blank","noopener,noreferrer");requestDialog.close()});
  function requestButton(card){const id=card.querySelector("th[id]")?.id||"",nameRow=[...card.querySelectorAll("tr")].find(row=>row.querySelector("th")?.textContent.includes("名前")),name=nameRow?.querySelector("td")?.textContent.trim()||"";const button=document.createElement("button");button.type="button";button.className="edit-request-button";button.textContent="内容の変更を申請";button.addEventListener("click",()=>{requestId=id;requestName=name;requestMember.textContent=`対象：No.${id} ${name}`;requestText.value="";requestDialog.showModal()});return button}
  const allBack=back.cloneNode(true),allBackBottom=back.cloneNode(true);for(const link of [allBack,allBackBottom])link.addEventListener("click",e=>{e.preventDefault();allView.hidden=true;directory.hidden=false;window.scrollTo(0,0)});allView.append(allBack);for(const card of cards){const copy=card.cloneNode(true);allView.append(copy,requestButton(card))}allView.append(allBackBottom);allLink.addEventListener("click",e=>{e.preventDefault();directory.hidden=true;allView.hidden=false;window.scrollTo(0,0)});
  list.addEventListener("click",e=>{const a=e.target.closest("a[data-member]");if(!a)return;e.preventDefault();const card=cardMap.get(a.dataset.member);if(!card)return;view.replaceChildren(back,card.cloneNode(true),requestButton(card));directory.hidden=true;view.hidden=false;window.scrollTo(0,0)});
  const search=toolbar?.querySelector("#member-search"),count=toolbar?.querySelector("#member-count");search?.addEventListener("input",()=>{const q=search.value.trim().toLocaleLowerCase();let visible=0;for(const li of list.querySelectorAll("li")){const show=li.textContent.toLocaleLowerCase().includes(q);li.hidden=!show;if(show)visible++}if(count)count.textContent=q?`検索結果 ${visible}名`:`メンバー ${list.querySelectorAll("li").length}名`});
  site.replaceChildren(header,directory,view,allView,requestDialog);document.getElementById("gate").style.display="none";site.style.display="block";
}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("error"),key=document.getElementById("key").value;msg.textContent="";try{const r=await fetch("profiles.enc.json",{cache:"no-store"});if(!r.ok)throw 0;const box=await r.json(),cryptoKey=await derive(key,fromHex(box.salt)),encrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromHex(box.nonce),additionalData:AAD},cryptoKey,fromHex(box.ciphertext)),plain=await new Response(new Blob([encrypted]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();renderSite(JSON.parse(new TextDecoder().decode(plain)))}catch{msg.textContent="鍵が違うか、サイトを読み込めませんでした。もう一度お試しください。"}});
</script></body></html>
